<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quan hệ song song trong không gian</title>
<meta name="description" content="Trình chiếu dạy học Chương IV Hình học 11 (Kết nối tri thức): Bài 10–14 và bài tập cuối chương, hình không gian xoay được, lời giải hiện từng bước.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;1,400;1,600&display=swap">
<style>
/* Bố cục: "bảng xanh" ở đầu (chương · các bài · công cụ) · sân khấu hai cột (nội dung bài | hình không gian) · thanh điều khiển ở cuối */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --surface-2:#edf1eb; --ink:#13201a; --ink-2:#3d4c44; --muted:#5f6d65;
  --line:#d6ddd6; --line-2:#bfcac2;
  --board:#1e4a3c; --board-2:#28594a; --board-ink:#eef5f0; --board-mute:#a8c5b7; --board-line:rgba(255,255,255,.26);
  --chalk:#f3e39a; --chalk-ink:#1d2a20;
  --accent:#1c6a50; --accent-ink:#ffffff; --accent-soft:#ddeee5;
  --key:#fff0b3; --key-ink:#4a3900;
  --box:#fff6e7; --box-line:#e39837; --box-ink:#8a4a0e;
  --note:#eef4fb; --note-line:#9db9dc; --note-ink:#1f4c7a;
  --ok:#137a3b; --ok-soft:#e0f3e6; --no:#bd3a2c; --no-soft:#fbe4e0;
  --figbg:#fdfdfb; --fk:#1d2620; --f1:#1f63d6; --f2:#e2620f; --f3:#13894a; --f4:#d22f3b; --f5:#7446d6; --f6:#6b7a72; --fl:#c9d2cc;
  --font:"Be Vietnam Pro","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --math:"Noto Serif","Times New Roman",Times,"Cambria",serif;
  --fs:1;
}
:root[data-theme="dark"]{
  --bg:#0d1311; --surface:#141c19; --surface-2:#1a2420; --ink:#e8efea; --ink-2:#bac7bf; --muted:#8e9c93;
  --line:#26322d; --line-2:#36453e;
  --board:#112b23; --board-2:#1b3c31; --board-ink:#e6f1ea; --board-mute:#8fb3a2; --board-line:rgba(255,255,255,.2);
  --chalk:#e7d47c; --chalk-ink:#16201a;
  --accent:#58c196; --accent-ink:#0a1912; --accent-soft:#183b2e;
  --key:#40371a; --key-ink:#f5e6a6;
  --box:#2a2114; --box-line:#b7772b; --box-ink:#f2c78f;
  --note:#15243a; --note-line:#3c6596; --note-ink:#a9c8ee;
  --ok:#4cc27a; --ok-soft:#14321f; --no:#f08072; --no-soft:#3b1d19;
  --figbg:#111916; --fk:#e3ebe6; --f1:#6aa3ff; --f2:#ff9a52; --f3:#4fd08a; --f4:#ff6b74; --f5:#b393ff; --f6:#93a39a; --fl:#34423b;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:calc(112.5% * var(--fs));-webkit-text-size-adjust:100%}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.6}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{min-height:100%;display:flex;flex-direction:column}

/* ---- Bảng xanh ---- */
.board{background:var(--board);color:var(--board-ink);display:flex;flex-wrap:wrap;align-items:center;gap:.45rem 1rem;padding:.5rem clamp(16px,2vw,26px)}
.brand{min-width:0;flex:0 1 auto}
.eyebrow{margin:0;font-size:.62rem;letter-spacing:.09em;text-transform:uppercase;color:var(--board-mute);font-weight:600}
.brand h1{margin:0;font-size:.98rem;line-height:1.25;font-weight:700;text-wrap:balance}
.lessons{display:flex;gap:.3rem;flex:1 1 auto;overflow-x:auto;scrollbar-width:thin;min-width:0;padding-bottom:2px}
.lessons button,.tbtn{background:transparent;border:1px solid var(--board-line);color:var(--board-ink);border-radius:999px;padding:.22rem .7rem;font-size:.76rem;cursor:pointer;white-space:nowrap}
.lessons button:hover,.tbtn:hover{background:var(--board-2)}
.lessons button[aria-current="true"]{background:var(--chalk);border-color:var(--chalk);color:var(--chalk-ink);font-weight:600}
.tools{display:flex;gap:.3rem;align-items:center;flex-wrap:wrap}
.tbtn[aria-pressed="true"]{background:var(--board-2);border-color:var(--chalk)}
.tbtn svg{display:block;width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tbtn.ic{padding:.3rem .5rem}

/* ---- Sân khấu ---- */
.stage{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:.9rem;padding:.8rem clamp(12px,1.6vw,24px);align-items:start}
body.wide .stage{grid-template-columns:minmax(0,1fr)}
body.figmax .stage{grid-template-columns:minmax(0,1fr)}
body.figmax .lesson{display:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.lesson{padding:1rem 1.35rem 1.3rem}
body.wide .lesson{max-width:1240px;width:100%;justify-self:center}
@media (min-width:980px) and (min-height:560px){
  .app{height:100%}
  .stage{flex:1;min-height:0;align-items:stretch;grid-template-rows:minmax(0,1fr)}
  .lesson{overflow:auto;overscroll-behavior:contain}
  .figp{display:flex;flex-direction:column;min-height:0}
}

/* ---- Đầu màn ---- */
.e5{display:flex;gap:.25rem;flex-wrap:wrap;margin:0 0 .4rem;padding:0;list-style:none}
.e5 li{font-size:.66rem;padding:.05rem .5rem;border-radius:999px;color:var(--muted);border:1px solid var(--line)}
.e5 li.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.kicker{font-size:.72rem;color:var(--muted);margin:0;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:.05rem .45rem;border-radius:5px;background:var(--surface-2);color:var(--ink-2)}
.tag.hd{background:#e6eefc;color:#1d4a9c}.tag.vd{background:#e3f4ea;color:#11643a}.tag.lt{background:#f3e8fb;color:#6a2c9c}
.tag.vdg{background:#fdecdc;color:#94420b}.tag.bt{background:#fbe6e6;color:#9b2525}.tag.kn{background:#fff1cc;color:#7a5200}
:root[data-theme="dark"] .tag.hd{background:#1b2d4c;color:#a9c4f5}:root[data-theme="dark"] .tag.vd{background:#15301f;color:#8fdcab}
:root[data-theme="dark"] .tag.lt{background:#2c1d3c;color:#d2b0f2}:root[data-theme="dark"] .tag.vdg{background:#3a2412;color:#f6bd8c}
:root[data-theme="dark"] .tag.bt{background:#3b1a1a;color:#f3a7a7}:root[data-theme="dark"] .tag.kn{background:#3a2f12;color:#f1d88c}
.lesson h2{font-size:1.3rem;line-height:1.28;margin:.15rem 0 .65rem;text-wrap:balance}
.lesson h2:focus{outline:none}
.lesson h3{font-size:.95rem;margin:.9rem 0 .35rem}
.lesson p{margin:.45rem 0}
.cont>*:first-child{margin-top:0}

/* ---- Khối nội dung ---- */
.lbl{font-weight:700;color:var(--accent)}
.box{background:var(--box);border:1.5px solid var(--box-line);border-radius:10px;padding:.55rem .95rem;margin:.65rem 0}
.box .bt{color:var(--box-ink);font-weight:700;display:block;font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;margin-bottom:.1rem}
.box p{margin:.3rem 0}
.box ul{margin:.2rem 0;padding-left:1.15rem}
.note{background:var(--note);border-left:4px solid var(--note-line);border-radius:8px;padding:.45rem .9rem;margin:.6rem 0}
.note .bt{color:var(--note-ink);font-weight:700;font-size:.8rem}
.ask{background:var(--accent-soft);border-radius:10px;padding:.5rem .9rem;margin:.6rem 0}
.qa{border:1px dashed var(--line-2);border-radius:10px;padding:.45rem .85rem;margin:.55rem 0}
.qa .qq{display:flex;gap:.5rem;align-items:baseline}
.qa .qi{flex:0 0 auto;width:1.35em;height:1.35em;border-radius:50%;background:var(--no);color:#fff;font-weight:700;display:inline-grid;place-items:center;font-size:.8rem}
.qa .qb{margin-top:.25rem}
.qa .qans{margin:.35rem 0 .1rem;padding:.35rem .7rem;background:var(--ok-soft);border-radius:8px}
.lnk{background:none;border:0;padding:.15rem 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:.8rem}
.lnk:hover{color:var(--accent)}
ul.li,ol.abc{margin:.35rem 0;padding-left:0;list-style:none}
ul.li li{position:relative;padding-left:1.1rem;margin:.18rem 0}
ul.li li::before{content:"";position:absolute;left:.25rem;top:.72em;width:.38rem;height:.38rem;border-radius:50%;background:var(--accent)}
ol.abc li{display:flex;gap:.45rem;margin:.18rem 0}
ol.abc li>b:first-child{min-width:1.35em;color:var(--accent)}
.key{background:var(--key);color:var(--key-ink);border-radius:4px;padding:0 .22em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.src{font-size:.78rem;color:var(--muted)}
.tw{overflow-x:auto;margin:.5rem 0;max-width:100%}
table.tb{border-collapse:collapse;font-size:.9rem;min-width:100%}
.tb th,.tb td{border:1px solid var(--line-2);padding:.35rem .6rem;text-align:left;vertical-align:top}
.tb thead th{background:var(--surface-2)}

/* ---- Bước giải ---- */
.stp{margin:.5rem 0}
.stp>.ph{display:flex;width:100%;text-align:left;gap:.5rem;align-items:center;background:transparent;border:1.5px dashed var(--line-2);border-radius:10px;padding:.42rem .8rem;color:var(--muted);font-size:.85rem;cursor:pointer}
.stp>.ph:hover{border-color:var(--accent);color:var(--accent)}
.stp>.ph .n{font-weight:700}
.stp>.bd{display:none;border-left:3px solid var(--accent);padding:.05rem 0 .05rem .85rem}
.stp.on>.ph{display:none}
.stp.on>.bd{display:block;animation:fin .25s ease}
.stp .sl{display:block;font-size:.66rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-top:.1rem}
@keyframes fin{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---- Kí hiệu toán ---- */
.m{font-family:var(--math);white-space:nowrap}
.m i{font-style:italic}
.m sub,.m sup{font-size:.7em;line-height:0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .1em;line-height:1.15;font-size:.95em}
.fr>span{display:block;padding:0 .18em}
.fr>span:first-child{border-bottom:1.3px solid currentColor}
.sq{display:inline-flex;align-items:stretch}
.sq>span{border-top:1.3px solid currentColor;padding:0 .1em;margin-top:.12em}
.hat{position:relative;display:inline-block}
.hat::before{content:"";position:absolute;left:8%;right:8%;top:-.12em;height:.32em;border-top:1.3px solid currentColor;border-radius:50% 50% 0 0}
.wrapm .m{white-space:normal}

/* ---- Trắc nghiệm ---- */
.mc{border:1px solid var(--line);border-radius:12px;padding:.6rem .9rem;margin:.6rem 0}
.mc .mq{margin:0 0 .3rem}
.mc .ops{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:.3rem .5rem}
.op{display:flex;gap:.5rem;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line-2);border-radius:10px;padding:.35rem .7rem;cursor:pointer;align-items:baseline}
.op:hover{border-color:var(--accent)}
.op>b{color:var(--accent);min-width:1.2em}
.op.ok{border-color:var(--ok);background:var(--ok-soft)}
.op.no{border-color:var(--no);background:var(--no-soft)}
.op[aria-disabled="true"]{cursor:default}
.mx{margin-top:.35rem;font-size:.92rem}
.okt{color:var(--ok)}.not{color:var(--no)}

/* ---- Tổng quan bài/chương ---- */
.ovg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:.8rem;margin:.6rem 0}
.ovc{border:1px solid var(--line);border-radius:12px;padding:.6rem .95rem}
.ovc h3{margin:0 0 .3rem;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.ovc ul{margin:.1rem 0;padding-left:1.1rem}
.plan{columns:2 300px;column-gap:1.2rem;margin:.4rem 0}
.plan .ph5{break-inside:avoid;margin:0 0 .7rem}
.plan .ph5 h4{margin:0 0 .2rem;font-size:.76rem;color:var(--accent);letter-spacing:.05em;text-transform:uppercase}
.plan button{display:grid;grid-template-columns:1fr auto;gap:.5rem;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:.3rem .2rem;cursor:pointer;font-size:.88rem}
.plan button:hover{background:var(--surface-2)}
.plan .tg{font-size:.72rem;color:var(--muted);white-space:nowrap}
.lcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:.8rem;margin:.6rem 0}
.lcard{display:flex;flex-direction:column;gap:.3rem;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.75rem 1rem;cursor:pointer}
.lcard:hover{border-color:var(--accent)}
.lcard .no{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.lcard .ti{font-weight:700;font-size:1rem;line-height:1.3}
.lcard .ds{font-size:.82rem;color:var(--ink-2)}
.kbd{display:inline-block;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 .35em;font-size:.8em;background:var(--surface-2)}

/* ---- Ghi chú GV ---- */
.gv{margin-top:1.1rem;border:1.5px dashed var(--line-2);border-radius:12px;padding:0 1rem;background:var(--surface-2);font-size:.86rem}
.gv>summary{cursor:pointer;font-weight:700;color:var(--ink-2);padding:.45rem 0}
.gv ul{margin:.1rem 0 .7rem;padding-left:1.1rem}
.gv li{margin:.15rem 0}

/* ---- Hình ---- */
.figp{padding:.6rem .7rem .7rem}
.fhead{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;margin:0 0 .35rem}
.fhead .cap{font-weight:700;font-size:.85rem;flex:1;min-width:0}
.fbtn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:.18rem .55rem;font-size:.76rem;cursor:pointer;white-space:nowrap}
.fbtn:hover{border-color:var(--accent)}
.fbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fwrap{position:relative;flex:1;min-height:0;display:flex}
svg.fig{display:block;width:100%;height:100%;min-height:260px;background:var(--figbg);border:1px solid var(--line);border-radius:10px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
svg.fig:active{cursor:grabbing}
@media (max-width:979px),(max-height:559px){svg.fig{height:auto;aspect-ratio:4/3;max-height:70vh}}
.fhint{font-size:.72rem;color:var(--muted);margin:.35rem 0 0}
.pars{display:flex;flex-direction:column;gap:.15rem;margin-top:.35rem}
.par{display:flex;align-items:center;gap:.6rem;font-size:.85rem}
.par .pl{min-width:9.5em}
.par input[type=range]{flex:1;accent-color:var(--accent);height:26px}
.par output{min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.fcap2{font-size:.78rem;color:var(--ink-2);margin:.3rem 0 0}
svg.fig .e{fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.fig .k0{stroke:var(--fk)}svg.fig .k1{stroke:var(--f1)}svg.fig .k2{stroke:var(--f2)}svg.fig .k3{stroke:var(--f3)}svg.fig .k4{stroke:var(--f4)}svg.fig .k5{stroke:var(--f5)}svg.fig .k6{stroke:var(--f6)}
svg.fig .q0{fill:var(--fk)}svg.fig .q1{fill:var(--f1)}svg.fig .q2{fill:var(--f2)}svg.fig .q3{fill:var(--f3)}svg.fig .q4{fill:var(--f4)}svg.fig .q5{fill:var(--f5)}svg.fig .q6{fill:var(--f6)}
svg.fig .dot{stroke:var(--figbg)}
svg.fig text{font-family:var(--math);paint-order:stroke;stroke:var(--figbg);stroke-linejoin:round}
svg.fig text.pn{font-style:italic;font-weight:600}
svg.fig text.tx{font-family:var(--font);font-weight:600}
svg.fig .bgr{fill:var(--figbg)}

/* ---- Thanh điều khiển ---- */
.ctrl{display:flex;align-items:center;gap:.45rem .55rem;flex-wrap:wrap;padding:.45rem clamp(12px,1.6vw,24px) calc(.45rem + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.ctrl .mid{display:flex;gap:.35rem;flex-wrap:wrap}
.ctrl .sp{flex:1}
.btn{font-size:.85rem;border-radius:10px;padding:.4rem .85rem;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.sm{padding:.18rem .6rem;font-size:.8rem;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.count{font-size:.78rem;color:var(--muted);white-space:nowrap;max-width:24em;overflow:hidden;text-overflow:ellipsis}
.timer{display:flex;align-items:center;gap:.25rem}
.timer .tl{font-size:.75rem;color:var(--muted)}
.timer output{font-weight:700;font-variant-numeric:tabular-nums;min-width:3.2em;text-align:center}
.timer.done output{color:var(--no)}

/* ---- Bút vẽ ---- */
#ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
body.pen #ink{pointer-events:auto;cursor:crosshair;touch-action:none}
.pentools{position:fixed;right:14px;top:72px;z-index:20;display:flex;flex-direction:column;gap:.35rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.45rem;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.pentools button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line-2);cursor:pointer;background:var(--surface)}
.pentools button[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:1px}
.pentools .cl{border-radius:8px;width:34px;font-size:.7rem;padding:0}

@media (max-width:1180px){.brand{flex:1 1 auto}.lessons{order:3;width:100%;flex-basis:100%}}
@media (max-width:979px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .figp{order:-1}
  .ctrl{position:sticky;bottom:0;z-index:5}
}
@media (max-width:600px){
  .lesson{padding:.85rem .95rem 1rem}
  .lesson h2{font-size:1.12rem}
  .timer,#revealAll,.ctrl .lg,#count{display:none}
  .ctrl .mid{flex:1}.ctrl #reveal{flex:1}
  .tools{width:100%}
}
@media (hover:none) and (pointer:coarse){.btn{min-height:44px}.lessons button,.tbtn,.fbtn{min-height:36px}}
@media (prefers-reduced-motion:reduce){.stp.on>.bd{animation:none}}
</style>
</head>
<body>
<div class="app">
<header class="board">
  <div class="brand"><p class="eyebrow" id="eyebrow"></p><h1 id="ctitle"></h1></div>
  <nav class="lessons" id="lessons" aria-label="Các bài trong chương"></nav>
  <div class="tools">
    <button type="button" class="tbtn" id="btnPen" aria-pressed="false" title="Bút vẽ (phím B)">Bút vẽ</button>
    <button type="button" class="tbtn" id="btnNotes" aria-pressed="true" title="Ghi chú giáo viên (phím G)">Ghi chú GV</button>
    <button type="button" class="tbtn" id="fsDown" aria-label="Giảm cỡ chữ">A−</button>
    <button type="button" class="tbtn" id="fsUp" aria-label="Tăng cỡ chữ">A+</button>
    <button type="button" class="tbtn ic" id="btnTheme" aria-label="Đổi nền sáng/tối" title="Nền sáng/tối"><svg viewBox="0 0 16 16"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z"/></svg></button>
    <button type="button" class="tbtn ic" id="btnFull" aria-label="Toàn màn hình" title="Toàn màn hình (phím F)"><svg viewBox="0 0 16 16"><path d="M1.5 5.5v-4h4M10.5 1.5h4v4M14.5 10.5v4h-4M5.5 14.5h-4v-4"/></svg></button>
  </div>
</header>
<main class="stage" id="stage">
  <article class="panel lesson" id="lesson"></article>
  <aside class="panel figp" id="figp" aria-label="Hình không gian">
    <div class="fhead"><span class="cap" id="fcap"></span>

<script>
'use strict';
/* ================= Hình học vectơ (dùng trong dữ liệu bài) ================= */
const V = (x, y, z) => [x, y, z];
const add = (u, v) => [u[0] + v[0], u[1] + v[1], u[2] + v[2]];
const sub = (u, v) => [u[0] - v[0], u[1] - v[1], u[2] - v[2]];
const mul = (u, k) => [u[0] * k, u[1] * k, u[2] * k];
const dot = (u, v) => u[0] * v[0] + u[1] * v[1] + u[2] * v[2];
const cross = (u, v) => [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
const len = u => Math.hypot(u[0], u[1], u[2]);
const unit = u => { const l = len(u) || 1; return [u[0] / l, u[1] / l, u[2] / l]; };
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const mid = (a, b) => lerp(a, b, .5);
const cen = (...ps) => mul(ps.reduce((s, p) => add(s, p), [0, 0, 0]), 1 / ps.length);
const footL = (p, a, b) => { const d = sub(b, a); return add(a, mul(d, dot(sub(p, a), d) / dot(d, d))); };
const nrm = (a, b, c) => unit(cross(sub(b, a), sub(c, a)));
const footP = (p, a, b, c) => { const n = nrm(a, b, c); return sub(p, mul(n, dot(sub(p, a), n))); };
/* giao điểm hai đường thẳng (đồng phẳng) AB và CD */
function xLL(a, b, c, d) {
  const u = sub(b, a), v = sub(d, c), w = sub(a, c);
  const A = dot(u, u), B = dot(u, v), C = dot(v, v), D = dot(u, w), E = dot(v, w), den = A * C - B * B;
  if (Math.abs(den) < 1e-12) return mid(a, c);
  const s = (B * E - C * D) / den, t = (A * E - B * D) / den;
  return mid(add(a, mul(u, s)), add(c, mul(v, t)));
}
/* giao điểm đường thẳng PQ với mặt phẳng ABC */
function xLP(p, q, a, b, c) { const n = cross(sub(b, a), sub(c, a)), d = sub(q, p), den = dot(d, n); return Math.abs(den) < 1e-12 ? p : add(p, mul(d, dot(sub(a, p), n) / den)); }
/* hình bình hành mặt phẳng: tâm o, hai nửa cạnh u, v */
const quad = (o, u, v) => [add(add(o, mul(u, -1)), mul(v, -1)), add(add(o, u), mul(v, -1)), add(add(o, u), v), add(add(o, mul(u, -1)), v)];
const deg = x => x * Math.PI / 180;
/* thiết diện của đa diện lồi (danh sách cạnh) với mặt phẳng qua p0, pháp tuyến n0: trả về đa giác theo thứ tự */
function section(edges, p0, n0) {
  const out = [];
  edges.forEach(([a, b]) => { const da = dot(sub(a, p0), n0), db = dot(sub(b, p0), n0); if ((da <= 1e-12 && db >= -1e-12) || (da >= -1e-12 && db <= 1e-12)) { if (Math.abs(da - db) < 1e-12) return; const p = lerp(a, b, da / (da - db)); if (!out.some(q => len(sub(q, p)) < 1e-7)) out.push(p); } });
  if (out.length < 3) return out;
  const c = cen(...out), n = unit(n0), u = unit(sub(out[0], c)), v = cross(n, u);
  return out.sort((p, q) => Math.atan2(dot(sub(p, c), v), dot(sub(p, c), u)) - Math.atan2(dot(sub(q, c), v), dot(sub(q, c), u)));
}
/* các cạnh của khối từ danh sách mặt */
function edgesOf(pts, faces) { const m = new Map(); faces.trim().split(/\s+/).forEach(f => { const ns = f.match(/_[A-Za-z0-9]+|[A-Z][0-9]*'{0,2}/g); ns.forEach((a, i) => { const b = ns[(i + 1) % ns.length], k = [a, b].sort().join('|'); if (!m.has(k)) m.set(k, [pts[a], pts[b]]); }); }); return [...m.values()]; }
/* gán tên cho dãy điểm: names('_c', [p0, p1, ...]) → {_c0: p0, ...} */
const names = (k, arr) => { const r = {}; arr.forEach((p, i) => { r[k + i] = p; }); return r; };
const chain = (k, n) => Array.from({length: n}, (_, i) => k + i).join('');
/* tiện ích dựng hình dùng chung */
const PQ = (k, o, u, v) => { const q = quad(o, u, v), r = {}; q.forEach((p, i) => { r[k + (i + 1)] = p; }); return r; };
const PLANE = (k, n, c, extra) => Object.assign({p: `${k}1${k}2${k}3${k}4`, c: c == null ? 1 : c, o: .1, occ: 1, pn: n ? {n} : null}, extra || {});
const ring = (k, n) => Array.from({length: n}, (_, i) => `${k}${i}${k}${(i + 1) % n}`).join(' ');
const circ = (k, c, u, v, n) => { const r = {}; for (let i = 0; i < n; i++) { const t = 2 * Math.PI * i / n; r[k + i] = add(c, add(mul(u, Math.cos(t)), mul(v, Math.sin(t)))); } return r; };
const projOn = (M, p0, n, d) => sub(M, mul(d, dot(sub(M, p0), n) / dot(d, n)));
const angDeg = (u, v) => Math.acos(Math.min(1, Math.abs(dot(u, v)) / (len(u) * len(v) || 1))) * 180 / Math.PI;
const fmtDeg = x => (Math.round(x * 10) / 10).toString().replace('.', ',') + '°';
const fmtN = (x, d) => (Math.round(x * 10 ** (d == null ? 2 : d)) / 10 ** (d == null ? 2 : d)).toString().replace('.', ',');
</script>

    {k: 'vd', lab: 'Ví dụ 3', t: 'Giao tuyến qua trọng tâm', min: 6, pg: 'tr. 75',
      b: [`Cho tam giác $ABC$ và điểm $S$ không thuộc mặt phẳng $(ABC)$. Gọi $M$, $N$ lần lượt là trung điểm của $AB$, $AC$ (Hình 4.8).`, {ol: [`Chỉ ra một điểm chung của hai mặt phẳng $(SBN)$ và $(SCM)$ khác $S$.`, `Giao tuyến của hai mặt phẳng $(SBN)$ và $(SCM)$ có đi qua trọng tâm của tam giác $ABC$ hay không?`]}],
      st: [{l: 'Câu a', b: [`Trong tam giác $ABC$, hai trung tuyến $BN$ và $CM$ cắt nhau tại trọng tâm $G$. $G ∈ BN$ nên $G ∈ (SBN)$; $G ∈ CM$ nên $G ∈ (SCM)$. Vậy ==$G$ là điểm chung khác $S$==.`]}, {l: 'Câu b', b: [`$S$ và $G$ là hai điểm chung phân biệt nên giao tuyến của hai mặt phẳng là ==đường thẳng $SG$==, đi qua trọng tâm $G$.`, {note: `Để xác định giao tuyến của hai mặt phẳng, ta tìm ==hai điểm chung== của hai mặt phẳng đó.`}]}, {l: 'Tính chất 6', b: [{box: `**Tính chất 6.** Trên mỗi mặt phẳng, tất cả các kết quả đã biết trong hình học phẳng đều đúng.`}, `Ở câu a ta đã dùng tính chất trung tuyến của hình học phẳng trong mặt phẳng $(ABC)$.`]}],

    {k: 'kn', lab: 'HĐ6', t: 'Cách xác định một mặt phẳng', min: 5, pg: 'tr. 75',
      b: [`Ta đã biết: một mặt phẳng hoàn toàn xác định khi biết nó đi qua ba điểm không thẳng hàng.`,
        `**HĐ6.** Cho đường thẳng $d$ và điểm $A$ không thuộc $d$. Trên $d$ lấy hai điểm phân biệt $B$, $C$ (Hình 4.9). Mặt phẳng $(ABC)$ có chứa $A$ và $d$ không? Mặt phẳng $(ABC)$ có chứa hai đường thẳng $AB$ và $BC$ không?`],
      st: [{l: 'Trả lời HĐ6', b: [`$(ABC)$ chứa $A$; chứa $B$, $C$ nên chứa $d = BC$. $(ABC)$ cũng chứa $AB$ và $BC$.`]}, {l: 'Kết luận', b: [{box: [`• Một mặt phẳng được hoàn toàn xác định khi biết nó ==đi qua một điểm và chứa một đường thẳng không đi qua điểm đó==.`, `• Một mặt phẳng được hoàn toàn xác định khi biết nó ==chứa hai đường thẳng cắt nhau==.`]}, {note: `Mặt phẳng đi qua điểm $A$ và chứa $d$ kí hiệu là $\\text{mp}(A, d)$; mặt phẳng chứa hai đường thẳng cắt nhau $a$, $b$ kí hiệu là $\\text{mp}(a, b)$.`, h: 'Chú ý'}]}],
      fig: {cap: 'Hình 4.9', view: [-20, 24],
        pts: () => Object.assign(PQ('_p', V(1.2, 1, 0), V(3.2, 0, 0), V(.6, 1.8, 0)), {B: V(-.6, 0, 0), C: V(2.6, .3, 0), A: V(1.2, 2, 0)}),
        items: [{l: 'BC', x: [-.35, 1.35], c: 2, n: 'd'}, {pt: 'A'}, PLANE('_p', 'P', 1, {f: 1, occ: 0}), {s: 'AB AC', c: 1, f: 1}]}},

    {k: 'vd', lab: 'Ví dụ 4 · Luyện tập 4', t: 'Giao tuyến của mp(S, a) và mp(S, b)', min: 6, pg: 'tr. 76',
      b: [`Cho hai đường thẳng cắt nhau $a$, $b$ và điểm $S$ không thuộc $\\text{mp}(a, b)$ (Hình 4.10). Xác định giao tuyến của $\\text{mp}(S, a)$ và $\\text{mp}(S, b)$.`,
        `**Luyện tập 4.** Trong Ví dụ 4, vẽ đường thẳng $c$ cắt cả $a$ và $b$. Xác định giao tuyến của $\\text{mp}(S, a)$ và $\\text{mp}(S, c)$; của $\\text{mp}(S, b)$ và $\\text{mp}(S, c)$.`],
      st: [{l: 'Ví dụ 4', b: [`Gọi $M$ là giao điểm của $a$ và $b$. $M ∈ a$ nên $M ∈ \\text{mp}(S, a)$; $M ∈ b$ nên $M ∈ \\text{mp}(S, b)$. Hai mặt phẳng có hai điểm chung $S$, $M$ nên giao tuyến là ==$SM$==.`]}, {l: 'Luyện tập 4', b: [`Gọi $P = a ∩ c$, $Q = b ∩ c$. Lập luận tương tự: $\\text{mp}(S, a) ∩ \\text{mp}(S, c) = SP$; $\\text{mp}(S, b) ∩ \\text{mp}(S, c) = SQ$.`, `(Nếu $c$ đi qua $M$ thì cả hai giao tuyến đều là $SM$.)`]}],
      fig: {cap: 'Hình 4.10', view: [-20, 32],
        pts: () => { const M = V(1.2, 1, 0), da = unit(V(1, .15, 0)), db = unit(V(.35, 1, 0)), a1 = add(M, mul(da, -1.8)), a2 = add(M, mul(da, 3.2)), b1 = add(M, mul(db, -1.4)), b2 = add(M, mul(db, 2.6)), P = add(M, mul(da, 2.4)), Q = add(M, mul(db, 1.9)), S = V(.9, 1.5, 3.4); return {M, _a1: a1, _a2: a2, _b1: b1, _b2: b2, S, _c1: lerp(P, Q, -.35), _c2: lerp(P, Q, 1.35), P, Q}; },
        items: [{l: '_a1_a2', x: [-.1, 1.1], n: 'a', c: 1}, {l: '_b1_b2', x: [-.1, 1.1], n: 'b', c: 2}, {pt: 'S M'}, {p: 'S_a1_a2', c: 1, o: .12, e: 0}, {p: 'S_b1_b2', c: 2, o: .12, e: 0}, {s: 'SM', c: 4, w: 3.2, f: 1}, {l: '_c1_c2', x: [0, 1], n: 'c', c: 3, f: 2}, {pt: 'P Q', f: 2}, {s: 'SP SQ', c: 3, w: 2.8, f: 2}]}},

    {k: 'vdg', lab: 'Vận dụng 2', t: 'Hít cửa nam châm', min: 4, pg: 'tr. 76',

    {k: 'kn', lab: 'HĐ7', t: 'Hình chóp', min: 5, pg: 'tr. 76',
      b: [`Kim tự tháp, khối pha lê, khối rubik tam giác có đặc điểm chung nào với hình chóp tam giác đều đã học ở lớp 8?`,
        {box: [`• Cho đa giác lồi $A_1A_2...A_n$ và điểm $S$ nằm ngoài mặt phẳng chứa đa giác đó. Nối $S$ với các đỉnh $A_1$, $A_2$, ..., $A_n$ ta được $n$ tam giác $SA_1A_2$, $SA_2A_3$, ..., $SA_nA_1$. Hình gồm $n$ tam giác đó và đa giác $A_1A_2...A_n$ được gọi là ==hình chóp==, kí hiệu $S.A_1A_2...A_n$.`, `• $S$ là **đỉnh**, đa giác $A_1A_2...A_n$ là **mặt đáy**, các tam giác $SA_1A_2$,... là **mặt bên**, các đoạn $SA_1$, ..., $SA_n$ là **cạnh bên**, các cạnh của đa giác đáy là **cạnh đáy**.`]},
        {note: `Ta gọi tên hình chóp theo tên đa giác đáy: hình chóp tam giác, hình chóp tứ giác, hình chóp ngũ giác,...`, h: 'Chú ý'}],
      st: [{l: 'Trả lời HĐ7', b: [`Đều có một đỉnh và các mặt bên là tam giác chung đỉnh đó, mặt đáy là một đa giác.`]}],
      fig: {cap: 'Hình chóp n-giác (kéo thanh trượt đổi số cạnh đáy)', view: [-14, 18],

    {k: 'kn', lab: 'HĐ5', t: 'Định lí Thalès trong không gian', min: 7, pg: 'tr. 92',
      b: [`Cho ba mặt phẳng $(P)$, $(Q)$, $(R)$ đôi một song song. Hai đường thẳng phân biệt $d$, $d'$ cắt ba mặt phẳng lần lượt tại $A$, $B$, $C$ và $A'$, $B'$, $C'$ ($C$ khác $C'$). Gọi $D$ là giao điểm của $AC'$ và $(Q)$ (Hình 4.48).`, {ol: [`Các cặp đường thẳng $BD$ và $CC'$; $B'D$ và $AA'$ có song song với nhau không?`, `Các tỉ số $~frac{AB}{BC}$, $~frac{AD}{DC'}$, $~frac{A'B'}{B'C'}$ có bằng nhau không?`]},
        {box: `**Định lí Thalès.** Ba mặt phẳng đôi một song song chắn trên hai cát tuyến phân biệt bất kì những đoạn thẳng tương ứng tỉ lệ: $~frac{AB}{A'B'} = ~frac{BC}{B'C'} = ~frac{AC}{A'C'}$.`}],
      st: [{l: 'Câu a', b: [`Mặt phẳng $(ACC')$ cắt hai mặt phẳng song song $(Q)$, $(R)$ theo $BD$, $CC'$ nên $BD // CC'$. Tương tự $B'D // AA'$.`]}, {l: 'Câu b', b: [`Định lí Thalès trong tam giác $ACC'$: $~frac{AB}{BC} = ~frac{AD}{DC'}$; trong tam giác $C'A'A$: $~frac{AD}{DC'} = ~frac{A'B'}{B'C'}$. Vậy ba tỉ số bằng nhau.`]}],
      fig: {cap: 'Hình 4.48 · kéo để đổi hướng d′', view: [-22, 12], par: {t: {v: .9, min: -.6, max: 1.8, step: .02, lab: "Hướng của $d'$"}},
        pts: P => { const z = [0, 1.2, 3], A = V(-.6, .2, z[2]), C = V(.4, .7, z[0]), dd = V(1.4, P.t, 0), A1 = add(V(2.2, -.2, z[2]), V(0, 0, 0)), C1 = add(V(2.2, -.2, z[2]), add(mul(dd, 1), V(0, 0, -3))); const at = (p, q, zz) => lerp(p, q, (p[2] - zz) / (p[2] - q[2])); const r = Object.assign(PQ('_p', V(1.2, .6, z[2]), V(3, 0, 0), V(.5, 1.6, 0)), PQ('_q', V(1.2, .6, z[1]), V(3, 0, 0), V(.5, 1.6, 0)), PQ('_r', V(1.2, .6, z[0]), V(3, 0, 0), V(.5, 1.6, 0))); return Object.assign(r, {A, B: at(A, C, z[1]), C, "A'": A1, "B'": at(A1, C1, z[1]), "C'": C1, D: at(A, C1, z[1])}); },
        items: [PLANE('_p', 'P', 1, {occ: 0, o: .07}), PLANE('_q', 'Q', 3, {occ: 0, o: .07}), PLANE('_r', 'R', 2, {occ: 0, o: .07}), {l: 'AC', x: [-.15, 1.15], n: 'd', c: 0, w: 2.4}, {l: "A'C'", x: [-.15, 1.15], n: "d'", c: 0, w: 2.4}, {s: "AC'", c: 1, w: 2, f: 1}, {pt: 'D', f: 1}, {s: "BD CC'", c: 4, w: 2.4, f: 1}, {s: "B'D AA'", c: 2, w: 2.4, f: 1}]}},

    {k: 'vd', lab: 'Ví dụ 4 · Luyện tập 4', t: 'Áp dụng định lí Thalès', min: 6, pg: 'tr. 92',
      b: [`**Ví dụ 4.** Cho tứ diện $SABC$. Trên cạnh $SA$ lấy các điểm $A_1$, $A_2$ sao cho $A_2A_1 = 2A_1A$. Gọi $(P)$, $(Q)$ là hai mặt phẳng song song với $(ABC)$ và lần lượt đi qua $A_1$, $A_2$. $(P)$ cắt $SB$, $SC$ lần lượt tại $B_1$, $C_1$; $(Q)$ cắt $SB$, $SC$ lần lượt tại $B_2$, $C_2$ (Hình 4.49). Chứng minh rằng $B_2B_1 = 2B_1B$ và $C_2C_1 = 2C_1C$.`,

        pts: () => { const S = V(1.6, 1.2, 4.6), A = V(0, 1.4, 0), B = V(1.8, -1, 0), C = V(4.2, 1.2, 0), k1 = .2, k2 = .6; const at = (p, k) => lerp(p, S, k); return {S, A, B, C, A1: at(A, k1), B1: at(B, k1), C1: at(C, k1), A2: at(A, k2), B2: at(B, k2), C2: at(C, k2)}; },

    {k: 'kn', lab: 'HĐ6', t: 'Hình lăng trụ', min: 6, pg: 'tr. 93',
      b: [`Thanh sô-cô-la, cục tẩy, đồng hồ, bút chì,... có đặc điểm chung nào với hình lăng trụ đứng tam giác đã học ở lớp 7?`,
        {box: [`Cho hai mặt phẳng song song $(α)$, $(α')$. Trên $(α)$ cho đa giác lồi $A_1A_2...A_n$. Qua các đỉnh vẽ các đường thẳng đôi một song song, cắt $(α')$ lần lượt tại $A'_1$, $A'_2$, ..., $A'_n$. Hình gồm hai đa giác $A_1A_2...A_n$, $A'_1A'_2...A'_n$ và các tứ giác $A_1A'_1A'_2A_2$, ..., $A_nA'_nA'_1A_1$ được gọi là ==hình lăng trụ==, kí hiệu $A_1A_2...A_n.A'_1A'_2...A'_n$.`, `• Các đoạn $A_1A'_1$, ..., $A_nA'_n$: **cạnh bên**; hai đa giác: **hai mặt đáy**; các tứ giác: **mặt bên**.`]},
        {q: `Giải thích tại sao các mặt bên của hình lăng trụ là các hình bình hành. Từ đó suy ra các cạnh bên đôi một song song và có độ dài bằng nhau.`, a: `Tứ giác $A_1A'_1A'_2A_2$ có $A_1A'_1 // A_2A'_2$, và $A_1A_2 // A'_1A'_2$ (giao tuyến của mặt bên với hai mặt phẳng song song) nên là hình bình hành; do đó $A_1A'_1 = A_2A'_2 = ...$`}],
      st: [{l: 'Trả lời HĐ6', b: [`Đều có hai mặt đáy là hai đa giác bằng nhau nằm trên hai mặt phẳng song song, các mặt bên là hình bình hành (hình chữ nhật).`]}],
      fig: {cap: 'Hình lăng trụ n-giác (kéo thanh trượt)', view: [-20, 16],
        par: {n: {v: 5, min: 3, max: 7, step: 1, lab: 'Số cạnh đáy n'}, s: {v: .8, min: 0, max: 1.6, step: .05, lab: 'Độ nghiêng cạnh bên'}},
        pts: P => { const r = {}, w = V(P.s, .4 * P.s, 3); for (let i = 0; i < P.n; i++) { const t = deg(-100 + 360 * i / P.n), p = V(2.2 * Math.cos(t), 1.7 * Math.sin(t), 0); r['A' + (i + 1)] = p; r['A' + (i + 1) + "'"] = add(p, w); } return r; },
        solid: P => { const n = P.n, a = i => 'A' + (i % n + 1), f = []; for (let i = 0; i < n; i++) f.push(a(i) + a(i + 1) + a(i + 1) + "'" + a(i) + "'"); f.push(Array.from({length: n}, (_, i) => a(i)).join('')); f.push(Array.from({length: n}, (_, i) => a(i) + "'").join('')); return f.join(' '); },
        items: P => [{p: Array.from({length: P.n}, (_, i) => 'A' + (i + 1)).join(''), c: 2, o: .15, e: 0}, {p: Array.from({length: P.n}, (_, i) => 'A' + (i + 1) + "'").join(''), c: 2, o: .15, e: 0}]}},

    {k: 'vd', lab: 'Ví dụ 5 · Luyện tập 5', t: 'Cắt lăng trụ bởi mặt phẳng song song với đáy', min: 6, pg: 'tr. 93',
      b: [`**Ví dụ 5.** Cho hình lăng trụ tam giác $ABC.A'B'C'$. Một mặt phẳng song song với mặt đáy cắt các cạnh bên $AA'$, $BB'$, $CC'$ lần lượt tại $A''$, $B''$, $C''$ (Hình 4.51). Chứng minh rằng $ABC.A''B''C''$ là một hình lăng trụ.`,
        `**Luyện tập 5.** Cho hình lăng trụ tam giác $ABC.A'B'C'$. Gọi $M$, $M'$ lần lượt là trung điểm của $BC$, $B'C'$. Chứng minh rằng $AMC.A'M'C'$ là một hình lăng trụ.`],
      st: [{l: 'Ví dụ 5', b: [`Các cạnh bên $AA'$, $BB'$, $CC'$ đôi một song song nên $AA''$, $BB''$, $CC''$ đôi một song song. Lại có $(ABC) // (A''B''C'')$. Vậy ==$ABC.A''B''C''$ là hình lăng trụ==.`]}, {l: 'Luyện tập 5', b: [`$MM'$ là đường trung bình của hình bình hành $BCC'B'$ nên $MM' // CC' // AA'$. Ba đường thẳng $AA'$, $MM'$, $CC'$ đôi một song song, cắt hai mặt phẳng song song $(ABC)$, $(A'B'C')$ ⇒ $AMC.A'M'C'$ là hình lăng trụ.`]}],
      fig: {cap: 'Hình 4.51 · kéo để di chuyển mặt cắt', view: [-24, 16], par: {t: {v: .5, min: .15, max: .9, step: .01, lab: 'Độ cao mặt cắt'}},
        pts: P => { const p = PRISM3(3, .9); return Object.assign(p, {"A''": lerp(p.A, p["A'"], P.t), "B''": lerp(p.B, p["B'"], P.t), "C''": lerp(p.C, p["C'"], P.t), M: mid(p.B, p.C), "M'": mid(p["B'"], p["C'"])}); }, solid: SPR3,

    {k: 'kn', lab: 'HĐ7', t: 'Hình hộp', min: 5, pg: 'tr. 94',
      b: [`Hình ảnh nào trong HĐ6 gợi nên hình lăng trụ có đáy là hình bình hành?`,
        {box: [`Hình lăng trụ tứ giác $ABCD.A'B'C'D'$ có hai đáy là hình bình hành được gọi là ==hình hộp==.`, `– $A$ và $C'$, $B$ và $D'$, $C$ và $A'$, $D$ và $B'$: các cặp **đỉnh đối diện**.`, `– $AC'$, $BD'$, $CA'$, $DB'$: các **đường chéo**.`, `– $ABCD$ và $A'B'C'D'$, $ADD'A'$ và $BCC'B'$, $ABB'A'$ và $DCC'D'$: các cặp **mặt đối diện**.`]},
        {note: `Hai đỉnh đối diện là hai đỉnh không cùng thuộc bất kì mặt nào; hai mặt đối diện là hai mặt không có điểm chung.`}],
      st: [{l: 'Trả lời', b: [`Cục tẩy (hình hộp chữ nhật).`]}, {l: 'Các đường chéo', b: [`Bốn đường chéo $AC'$, $BD'$, $CA'$, $DB'$.`]}],
      fig: {cap: 'Hình hộp ABCD.A′B′C′D′', view: [-24, 16], pts: () => BOX(), solid: SBOX,
        items: [{p: 'ABCD', c: 2, o: .15, e: 0}, {p: "A'B'C'D'", c: 2, o: .15, e: 0}, {s: "AC' BD' CA' DB'", c: 4, w: 2.2, f: 2}]}},

    {k: 'vd', lab: 'Ví dụ 6 · Luyện tập 6', t: 'Các đường chéo của hình hộp', min: 6, pg: 'tr. 94',
      b: [`**Ví dụ 6.** Cho hình hộp $ABCD.A'B'C'D'$ (Hình 4.52). Chứng minh rằng các đường chéo $AC'$, $BD'$, $CA'$, $DB'$ cùng đi qua trung điểm của mỗi đường.`, `**Luyện tập 6.** Chứng minh rằng $(ADD'A') // (BCC'B')$.`],
      st: [{l: 'ADC′B′ là hình bình hành', b: [`$ABCD$ là hình bình hành: $AD // BC$, $AD = BC$. $BCC'B'$ là hình bình hành: $BC // B'C'$, $BC = B'C'$. Do đó $AD // B'C'$ và $AD = B'C'$: $ADC'B'$ là hình bình hành, nên $AC'$, $DB'$ cắt nhau tại trung điểm mỗi đường.`]}, {l: 'Kết luận', b: [`Tương tự $AC'$ và $BD'$, $AC'$ và $CA'$ cũng cắt nhau tại trung điểm mỗi đường. Vậy ==bốn đường chéo cùng đi qua trung điểm $O$ của mỗi đường==.`, {note: [`Các đường chéo của hình hộp cùng đi qua trung điểm của mỗi đường.`, `Các mặt đối diện của hình hộp song song với nhau và có thể coi là hai đáy.`], h: 'Nhận xét'}]}, {l: 'Luyện tập 6', b: [`$AD // BC$, $AA' // BB'$; $(ADD'A')$ chứa hai đường thẳng cắt nhau $AD$, $AA'$ cùng song song với $(BCC'B')$ ⇒ ==$(ADD'A') // (BCC'B')$==.`]}],
      fig: {cap: 'Hình 4.52', view: [-24, 16], pts: () => { const p = BOX(); return Object.assign(p, {O: mid(p.A, p["C'"])}); }, solid: SBOX,
        items: [{p: "ADC'B'", c: 1, o: .2, e: 0, f: 1}, {s: "AC' DB'", c: 4, w: 2.4, f: 1}, {s: "BD' CA'", c: 2, w: 2.4, f: 2}, {pt: 'O', f: 1}, {p: "ADD'A'", c: 3, o: .22, e: 0, f: 3}, {p: "BCC'B'", c: 3, o: .22, e: 0, f: 3}]}},

    {k: 'vdg', lab: 'Vận dụng 2', t: 'Đo mực nước bằng thanh gỗ', min: 5, pg: 'tr. 95',
      b: [`Bác Hà đặt một thanh gỗ đủ dài vào bể nước hình hộp: một đầu dựa vào mép nắp, đầu kia đặt trên đáy bể (Hình 4.53). Rút thanh gỗ ra, bác tính được tỉ lệ phần thanh gỗ ngâm nước so với cả thanh và cho rằng tỉ lệ đó bằng tỉ lệ giữa mực nước và chiều cao của bể. Giải thích vì sao.`],

const sunDir = P => { const a = deg(P.az), e = deg(P.el); return mul(V(Math.cos(e) * Math.cos(a), Math.cos(e) * Math.sin(a), Math.sin(e)), -1); };
const WINDOW = P => {
  const d = sunDir(P), z0 = V(0, 0, 0), nz = V(0, 0, 1), c = V(0, 0, 2.6), u = V(1.2, 0, 0), v = V(0, 0, 1.2), r = {};
  const sq = {A: add(c, add(mul(u, -.707), mul(v, .707))), B: add(c, add(mul(u, .707), mul(v, .707))), C: add(c, add(mul(u, .707), mul(v, -.707))), D: add(c, add(mul(u, -.707), mul(v, -.707))), O: c};
  Object.assign(r, sq, circ('_c', c, u, v, 36));
  Object.entries(sq).forEach(([k, p]) => { r[k + "'"] = projOn(p, z0, nz, d); });
  for (let i = 0; i < 36; i++) r['_s' + i] = projOn(r['_c' + i], z0, nz, d);
  Object.assign(r, PQ('_g', V(0, -1.8, 0), V(3.6, 0, 0), V(0, 2.6, 0)));
  return r;
};

function inkResize() { const r = $('#stage').getBoundingClientRect(), dpr = window.devicePixelRatio || 1; ink.width = Math.round(r.width * dpr); ink.height = Math.round(r.height * dpr); ictx.setTransform(dpr, 0, 0, dpr, 0, 0); inkRedraw(); }
function inkStrokes() { const k = skey(); if (!INK.has(k)) INK.set(k, []); return INK.get(k); }
function inkRedraw() { const r = $('#stage').getBoundingClientRect(); ictx.clearRect(0, 0, r.width, r.height); inkStrokes().forEach(st => { ictx.strokeStyle = st.c; ictx.lineWidth = 4; ictx.lineCap = 'round'; ictx.lineJoin = 'round'; ictx.beginPath(); st.p.forEach((p, i) => { const x = p[0] * r.width, y = p[1] * r.height; if (i) ictx.lineTo(x, y); else ictx.moveTo(x, y); }); ictx.stroke(); }); }
function inkLoad() { inkResize(); }
ink.addEventListener('pointerdown', e => { if (!document.body.classList.contains('pen')) return; const r = ink.getBoundingClientRect(); penDraw = {c: penColor, p: [[(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]]}; inkStrokes().push(penDraw); try { ink.setPointerCapture(e.pointerId); } catch (_) {} });
ink.addEventListener('pointermove', e => { if (!penDraw) return; const r = ink.getBoundingClientRect(); penDraw.p.push([(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]); inkRedraw(); });
const penUp = () => { penDraw = null; };
ink.addEventListener('pointerup', penUp); ink.addEventListener('pointercancel', penUp);
function togglePen(on) { on = on == null ? !document.body.classList.contains('pen') : on; document.body.classList.toggle('pen', on); $('#btnPen').setAttribute('aria-pressed', on ? 'true' : 'false'); $('#pentools').hidden = !on; }
$('#btnPen').onclick = () => togglePen();
$$('[data-pc]').forEach(b => { b.onclick = () => { penColor = b.dataset.pc; $$('[data-pc]').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false')); }; });
$('#penUndo').onclick = () => { inkStrokes().pop(); inkRedraw(); };
$('#penClear').onclick = () => { INK.set(skey(), []); inkRedraw(); };

/* ================= Công cụ: ghi chú, cỡ chữ, nền, toàn màn hình, bấm giờ ================= */
function applyPrefs() {
  document.documentElement.style.setProperty('--fs', ST.fs);
  document.documentElement.setAttribute('data-theme', ST.theme);
  $('#btnNotes').setAttribute('aria-pressed', ST.notes ? 'true' : 'false');
  const g = $('.gv', lessonEl); if (g) g.hidden = !ST.notes;
}
$('#btnNotes').onclick = () => { ST.notes = !ST.notes; applyPrefs(); save(); };
$('#fsUp').onclick = () => { ST.fs = clamp(Math.round((ST.fs + .1) * 10) / 10, .8, 1.6); applyPrefs(); save(); drawFig(); inkResize(); };
$('#fsDown').onclick = () => { ST.fs = clamp(Math.round((ST.fs - .1) * 10) / 10, .8, 1.6); applyPrefs(); save(); drawFig(); inkResize(); };
$('#btnTheme').onclick = () => { ST.theme = ST.theme === 'dark' ? 'light' : 'dark'; applyPrefs(); save(); };
function toggleFull() { try { if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {}); } catch (_) {} }
$('#btnFull').onclick = toggleFull;
const TM = {end: 0, id: 0, done: false};
const fmtT = ms => { const s = Math.ceil(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
function timerUI() {
  const el = $('#timer');
  if (!TM.end && !TM.done) { el.className = 'timer'; el.innerHTML = `<span class="tl">Bấm giờ</span>${[1, 3, 5].map(x => `<button type="button" class="btn sm" data-tm="${x}" aria-label="Bấm giờ ${x} phút">${x}′</button>`).join('')}`; return; }
  el.className = 'timer' + (TM.done ? ' done' : '');
  el.innerHTML = `<output>${TM.done ? 'Hết giờ' : fmtT(TM.end - Date.now())}</output><button type="button" class="btn sm" data-tm="0">${TM.done ? 'Xong' : 'Dừng'}</button>`;
}
function startTimer(m) { clearInterval(TM.id); TM.id = 0; TM.done = false; if (!m) { TM.end = 0; timerUI(); return; } TM.end = Date.now() + m * 60000; timerUI(); TM.id = setInterval(() => { if (Date.now() >= TM.end) { clearInterval(TM.id); TM.done = true; announce('Hết giờ'); timerUI(); } else { const o = $('#timer output'); if (o) o.textContent = fmtT(TM.end - Date.now()); } }, 250); }

/* ================= Sự kiện ================= */
document.addEventListener('click', e => {
  const t = e.target, c = s => t.closest(s); let b;
  if ((b = c('[data-reveal]'))) { setK(+b.dataset.reveal); return; }
  if ((b = c('[data-lesson]'))) { go(+b.dataset.lesson, 0); return; }
  if ((b = c('[data-goto]'))) { go(ST.L, +b.dataset.goto); return; }
  if ((b = c('[data-tm]'))) { startTimer(+b.dataset.tm); return; }
  if ((b = c('[data-qa]'))) { const a = document.getElementById(b.dataset.qa); a.hidden = !a.hidden; b.setAttribute('aria-expanded', a.hidden ? 'false' : 'true'); b.textContent = a.hidden ? 'Xem gợi ý trả lời' : 'Ẩn gợi ý'; return; }
  if ((b = c('[data-op]'))) { const box = b.closest('[data-mc]'), st = MCS.get(box.dataset.mc); if (st.ch == null) { st.ch = +b.dataset.op; box.innerHTML = mcInner(box.dataset.mc); } return; }
  if ((b = c('[data-mcshow]'))) { const box = b.closest('[data-mc]'); MCS.get(box.dataset.mc).ch = 'show'; box.innerHTML = mcInner(box.dataset.mc); return; }
  if ((b = c('[data-mcreset]'))) { const box = b.closest('[data-mc]'); MCS.get(box.dataset.mc).ch = null; box.innerHTML = mcInner(box.dataset.mc); return; }
});
$('#prev').onclick = retreat;
$('#next').onclick = nextScreen;
$('#reveal').onclick = () => setK(kOf() + 1);
$('#revealAll').onclick = () => setK(kOf() < nSteps(scr()) ? nSteps(scr()) : 0);
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const t = e.target, tag = t.tagName;
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(tag) || t.isContentEditable) return;
  const onCtl = ['BUTTON', 'SUMMARY', 'A'].includes(tag);
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || (e.key === ' ' && !onCtl)) { e.preventDefault(); advance(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); retreat(); }
  else if (e.key === 'g' || e.key === 'G') { ST.notes = !ST.notes; applyPrefs(); save(); }
  else if (e.key === 'f' || e.key === 'F') toggleFull();
  else if (e.key === 'b' || e.key === 'B') togglePen();
  else if (e.key === 'h' || e.key === 'H') toggleFigMax();
  else if (e.key === 'Escape') { if (document.body.classList.contains('pen')) togglePen(false); else if (document.body.classList.contains('figmax')) toggleFigMax(); }
});
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { drawFig(); inkResize(); }, 100); });

/* ================= Khởi động ================= */
(function init() {
  const hm = /^#bai-(\d+)-(\d+)$/.exec(location.hash || '');
  if (hm) { ST.L = clamp(+hm[1], 0, LESSONS.length - 1); ST.S = clamp(+hm[2], 0, LESSONS[ST.L].screens.length - 1); }
  else if (location.hash === '#tong-quan') { ST.L = 0; ST.S = 0; }
  applyPrefs(); timerUI(); render();
})();
</script>
</body>
</html>
